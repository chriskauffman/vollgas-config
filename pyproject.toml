[tool.poetry]
name = "vollgas_config"
version = "1.1.0"
description = "Config tool provides basic configuration file locating, loading and validation."
authors = ["Christopher Kauffman <chriskauffman@vollgas.net>"]
license = "MIT"

[tool.poetry.dependencies]
python = ">3.11,<3.12"
pyyaml = "^6.0.1"
mergedeep = "^1.3.4"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pylint = "^3.0.2"
pydocstyle = "^6.3.0"
pylava = "^0.3.0"
black = "^23.11.0"
importlib-resources = "^6.1.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.masonry.api"
