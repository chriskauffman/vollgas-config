[tool.poetry]
name = "vollgas_config"
version = "1.0.0-beta.1"
description = "Config tool provides basic configuration file locating, loading and validation."
authors = ["Christopher Kauffman <chriskauffman@vollgas.net>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.7"
pyyaml = "^5.3"
mergedeep = "^1.1.1"

[tool.poetry.dev-dependencies]
pytest = "^5.3"
pylint = "^2.4"
pydocstyle = "^5.0"
pylava = "^0.2.2"
black = {version = "^18.3-alpha.0", allow-prereleases = true}

[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"
